<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Reform</title>
    <style>
        @font-face {
            font-family: 'Opus Chords Sans Condensed';
            src: url('OPUSCSC.woff') format('woff'),
                 url('OPUSCSC.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
            color: #444;
            font-family: 'Lucida Console', monospace;
            font-size: 15px;
            line-height: 1.35;
            text-transform: uppercase;
            padding-bottom: 20vw; /* keeps text clear of the fixed heading */
        }

        /* ---- big heading ---- */
        h1 {
            font-family: 'Opus Chords Sans Condensed', sans-serif;
            color: #000;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            margin: 0;
            padding: 0 1vw;
            box-sizing: border-box;
            font-size: 10vw;
            line-height: 1;
            white-space: nowrap;
            text-align: justify;
            text-align-last: justify;
            z-index: 1;
        }

        /* ---- columns ---- */
        .column-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4vw;
            padding: 150px 4.5vw 0;
            box-sizing: border-box;
        }
