<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    body {
      margin: 2rem;
      background: #fafafa;
    }

    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* stops the last row from stretching across the whole width */
    #gallery::after {
      content: '';
      flex-grow: 1000000;
    }

    .gallery-item {
      height: 250px;        /* target row height: raise for bigger images */
      width: 250px;         /* placeholder until the image loads */
      flex-grow: 1;
      overflow: hidden;
    }

    .gallery-item a {
      display: block;
      height: 100%;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;    /* only absorbs tiny rounding differences */
      display: block;
    }

    #gallery > p {
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="gallery"><p>Loading images...</p></div>

  <script>
    const CHANNEL_SLUG = 'do-u-want-to-look-at-this';
    const API_URL = `https://api.are.na/v2/channels/${CHANNEL_SLUG}?per=100`;
    const ROW_HEIGHT = 250;   // keep in sync with .gallery-item height in the CSS

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replace(/"/g, '&quot;');
    }

    async function loadArenaGallery() {
      const galleryContainer = document.getElementById('gallery');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`Error fetching channel: ${response.status}`);
        }

        const data = await response.json();
        const contents = data.contents || [];

        galleryContainer.innerHTML = '';

        const imageBlocks = contents.filter(block => block.class === 'Image');

        if (imageBlocks.length === 0) {
          galleryContainer.innerHTML = '<p>No images found in this channel.</p>';
          return;
        }

        imageBlocks.forEach(block => {
          const imageUrl = block.image.display.url;
          const fullUrl = block.image.original.url;
          const alt = escapeHTML(block.title || '');

          const itemEl = document.createElement('div');
          itemEl.className = 'gallery-item';
          itemEl.innerHTML = `
            <a href="${fullUrl}" target="_blank" rel="noopener">
              <img src="${imageUrl}" alt="${alt}">
            </a>
          `;

          // once the image loads, size its frame to the image's real proportions
          const img = itemEl.querySelector('img');
          const fit = () => {
            const ratio = img.naturalWidth / img.naturalHeight;
            if (!ratio) return;
            itemEl.style.width = ratio * ROW_HEIGHT + 'px';
            itemEl.style.flexGrow = ratio * 100;
          };
          if (img.complete) fit();
          else img.addEventListener('load', fit);

          galleryContainer.appendChild(itemEl);
        });

      } catch (error) {
        console.error('Failed to load Are.na board:', error);
        galleryContainer.innerHTML = '<p>Failed to load gallery images.</p>';
      }
    }

    loadArenaGallery();
  </script>
</body>
</html>
