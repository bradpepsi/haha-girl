<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    body {
      margin: 2rem;
      background: #fafafa;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div id="gallery">Loading images...</div>

  <script>
    const CHANNEL_SLUG = 'do-u-want-to-look-at-this';
    const API_URL = `https://api.are.na/v2/channels/${CHANNEL_SLUG}?per=100`;

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replace(/"/g, '&quot;');
    }

    async function loadArenaGallery() {
      const galleryContainer = document.getElementById('gallery');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`Error fetching channel: ${response.status}`);
        }

        const data = await response.json();
        const contents = data.contents || [];

        galleryContainer.innerHTML = '';

        const imageBlocks = contents.filter(block => block.class === 'Image');

        if (imageBlocks.length === 0) {
          galleryContainer.innerHTML = '<p>No images found in this channel.</p>';
          return;
        }

        imageBlocks.forEach(block => {
          const imageUrl = block.image.display.url;
          const fullUrl = block.image.original.url;
          const alt = escapeHTML(block.title || '');

          const itemEl = document.createElement('div');
          itemEl.className = 'gallery-item';
          itemEl.innerHTML = `
            <a href="${fullUrl}" target="_blank" rel="noopener">
              <img src="${imageUrl}" alt="${alt}" loading="lazy">
            </a>
          `;

          galleryContainer.appendChild(itemEl);
        });

      } catch (error) {
        console.error('Failed to load Are.na board:', error);
        galleryContainer.innerHTML = '<p>Failed to load gallery images.</p>';
      }
    }

    loadArenaGallery();
  </script>
</body>
</html>
