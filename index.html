<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Implementation</title>
    <style>
        @font-face {
            font-family: 'Opus Chords Sans Condensed';
            src: url('OPUSCSC.woff') format('woff');
            src: url('OPUSCSC.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        } /* Closing brace added here */

        body {
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Opus Chords Sans Condensed', sans-serif;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            margin: 0;
            padding: 0 1vw;
            box-sizing: border-box;
            font-size: 5vw;          
            line-height: 1;
            white-space: nowrap;
            text-align: justify;
            text-align-last: justify; 
        }

        p {
            font-family: 'Lucinda Console', monospace;
            padding-left: 80px;
            padding-top: 80px;
            font-size: 1vw;
        }
    </style>
</head>
<body>
    <h1>FUNCTION REFORM</h1>
    <p>INFO<br>ARCHIVE<br>CONTACT</p> 
</body>
</html>
