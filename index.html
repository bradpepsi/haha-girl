<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Reform</title>
    <style>
        @font-face {
            font-family: 'Opus Chords Sans Condensed';
            src: url('OPUSCSC.woff') format('woff'),
                 url('OPUSCSC.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
        }

        h1 {
            font-family: 'Opus Chords Sans Condensed', sans-serif;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            margin: 0;
            padding: 0 1vw;
            box-sizing: border-box;
            font-size: 10vw;
            line-height: 1;
            white-space: nowrap;
            text-align: justify;
            text-align-last: justify;
            z-index: 1;
        }

        p {
            font-family: 'Lucida Console', monospace;
            font-size: 18px;
            position: fixed;
            top: 0;
            right: 0;
            padding: 0 1vw;
            text-align: right;
            z-index: 1;
        }

        /* ---- stitches ---- */
        #stitches {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .cross {
            position: absolute;
            width: 24px;
            height: 24px;
            background: url('cross.png') center / contain no-repeat; /* your PNG's filename */
            opacity: 0;
        }
