<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Reform</title>
    <style>
        @font-face {
            font-family: 'Opus Chords Sans Condensed';
            src: url('OPUSCSC.woff') format('woff'),
                 url('OPUSCSC.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
        }

        h1 {
            font-family: 'Opus Chords Sans Condensed', sans-serif;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            margin: 0;
            padding: 0 1vw;
            box-sizing: border-box;
            font-size: 10vw;
            line-height: 1;
            white-space: nowrap;
            text-align: justify;
            text-align-last: justify;
            z-index: 1;
        }

        p {
            font-family: 'Lucida Console', monospace;
            font-size: 18px;
            position: fixed;
            top: 0;
            right: 0;
            padding: 0 1vw;
            text-align: right;
            z-index: 1;
        }

        /* ---- stitches ---- */
        #stitches {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .cross {
            position: absolute;
            width: 24px;
            height: 24px;
            background: url('cross.png') center / contain no-repeat; /* your PNG's filename */
            opacity: 0;
        }

        /* hard cut: visible for the whole duration, then gone */
        .cross.on {
            animation: stitch var(--dur, 4s) steps(1, end) forwards;
        }

        @keyframes stitch {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="stitches"></div>
    <h1>FUNCTION REFORM</h1>
    <p><a href="info.html">INFO</a><br><a href="archive.html">ARCHIVE</a><br><a href="contact.html">CONTACT</a></p>

    <script>
        const field = document.getElementById('stitches');

        const CELL = 64;        // grid spacing in px
        const SIZE = 24;        // cross size, match the CSS

        const MAX_CALM  = 9;    // crosses on screen at normal pace
        const MAX_SURGE = 28;   // crosses on screen during a surge

        let cells = [];
        let surging = false;

        function build() {
            field.innerHTML = '';
            cells = [];
            const cols = Math.floor(innerWidth / CELL);
            const rows = Math.floor(innerHeight / CELL);
            const offX = (innerWidth - cols * CELL) / 2;
            const offY = (innerHeight - rows * CELL) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const el = document.createElement('div');
                    el.className = 'cross';
                    el.style.left = offX + c * CELL + (CELL - SIZE) / 2 + 'px';
                    el.style.top  = offY + r * CELL + (CELL - SIZE) / 2 + 'px';
                    field.appendChild(el);
                    cells.push(el);
                }
            }
        }

        function startSurge() {
            surging = true;
            setTimeout(() => {
                surging = false;
                scheduleSurge();
            }, 1500 + Math.random() * 2000);   // surge lasts 1.5 to 3.5s
        }

        function scheduleSurge() {
            setTimeout(startSurge, 6000 + Math.random() * 9000);  // next surge in 6 to 15s
        }

        function tick() {
            const max = surging ? MAX_SURGE : MAX_CALM;
            const active = cells.filter(el => el.classList.contains('on')).length;

            if (active < max) {
                const idle = cells.filter(el => !el.classList.contains('on'));
                const el = idle[Math.floor(Math.random() * idle.length)];
                if (el) {
                    const dur = surging
                        ? 0.4 + Math.random() * 0.8   // quick flickers
                        : 3 + Math.random() * 4;      // slow, calm
                    el.style.setProperty('--dur', dur + 's');
                    el.classList.add('on');
                    el.addEventListener('animationend',
                        () => el.classList.remove('on'), { once: true });
                }
            }

            const delay = surging
                ? 40 + Math.random() * 80     // rapid-fire
                : 300 + Math.random() * 700;  // calm
            setTimeout(tick, delay);
        }

        build();
        tick();
        scheduleSurge();
        addEventListener('resize', build);
    </script>
</body>
</html>
